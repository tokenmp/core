name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 工具链版本只在 .mise.toml 里声明，CI 通过 mise 读取同一份，
      # 不在这里另写版本号，避免两处漂移。
      - uses: jdx/mise-action@v3
      - name: 门禁
        run: make check

  # go.mod 声明的 go 指令是给使用者看的最低版本，只有真的在它上面编过一遍
  # 才站得住。这个 job 用 setup-go 拿那个版本，不经过 mise。
  min-go:
    name: min-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: 按 go.mod 声明的最低版本编译与测试
        run: |
          go version
          go build ./...
          go test -race ./...
