name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 工具链版本只在 .mise.toml 里声明，CI 通过 mise 读取同一份，
      # 不在这里另写版本号，避免两处漂移。
      - uses: jdx/mise-action@v3
      - name: 门禁
        run: make check
