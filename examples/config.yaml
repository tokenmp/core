# core 的示例配置：两个渠道、一组模型规则、一个插件。
# 复制出去改成自己的渠道即可，凭据只写环境变量名。
#
# 两个渠道指向同一个服务只是为了能直接跑起来。真实场景里它们应当是两家不同账号，
# 这样 models 里的 affinity 才有意义：同一个账号的两把 key 本来就共享提示缓存。

listen: 127.0.0.1:8787

log:
  format: text
  level: info

channels:
  - name: openrouter
    dialect: openai
    base_url: https://openrouter.ai/api/v1
    # 基址已经带了 /api/v1，因此这里显式给出从它之后的路径。
    path: /chat/completions
    auth:
      style: bearer
      key_env: OPENROUTER_API_KEY
    timeout: 120s

  # 第二个账号。没有配 auth，因此指向本地假上游时可以直接跑。
  - name: backup
    dialect: openai
    base_url: https://openrouter.ai/api/v1
    path: /chat/completions

models:
  - match: "gpt-*"
    channel: openrouter
  # 同一个模型的两条规则互为候选。affinity 打开后，带上会话标识的请求会粘在
  # 其中一家的账号上，让上游的提示缓存有机会命中。
  - match: "claude-*"
    channel: openrouter
    affinity: true
  - match: "claude-*"
    channel: backup

plugins:
  dir: plugins
  list:
    - key: echo
      enabled: true
      order: 10
      config:
        tag: example
